bundle:
  name: stress-demo

variables:
  postgres_branch:
    description: Lakebase branch resource name
  postgres_database:
    description: Lakebase database resource name
  genie_space_id:
    description: Genie space created by notebooks/03_genie.ipynb

resources:
  apps:
    app:
      name: "stress-demo"
      description: "Stress testing results and committee sign-off"
      source_code_path: ./

      # Start the app automatically on deploy.
      lifecycle:
        started: true

      # Genie runs on behalf of the signed-in user, so Unity Catalog applies that user's own permissions.
      # Lakebase runs as the app's service principal (read the synced gold, write committee decisions).
      user_api_scopes:
        - dashboards.genie

      resources:
        - name: postgres
          postgres:
            branch: ${var.postgres_branch}
            database: ${var.postgres_database}
            permission: CAN_CONNECT_AND_CREATE
        - name: genie-space
          genie_space:
            name: "Stress testing: risk committee"
            space_id: ${var.genie_space_id}
            permission: CAN_RUN

targets:
  default:
    default: true

    variables:
      postgres_branch: projects/stress-demo/branches/production
      postgres_database: projects/stress-demo/branches/production/databases/databricks-postgres
      genie_space_id: 01f1e1ac00111cf0a0038283f0103131
